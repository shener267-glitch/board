<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <!-- 架空の会場周辺図 (サンプル)。実在の場所とは関係ありません。 -->
  <rect width="1600" height="1100" fill="#e9ecdf"/>
  <!-- 緑地 -->
  <rect x="60" y="60" width="380" height="300" rx="20" fill="#cfe3b8"/>
  <rect x="1180" y="720" width="360" height="320" rx="20" fill="#cfe3b8"/>
  <!-- 道路 -->
  <g fill="#ffffff" stroke="#c9ccc2" stroke-width="2">
    <rect x="0" y="420" width="1600" height="90"/>
    <rect x="620" y="0" width="80" height="1100"/>
    <rect x="1100" y="510" width="60" height="590"/>
    <rect x="0" y="880" width="620" height="60"/>
  </g>
  <g stroke="#e0b64a" stroke-width="3" stroke-dasharray="24 18">
    <line x1="0" y1="465" x2="1600" y2="465"/>
    <line x1="660" y1="0" x2="660" y2="1100"/>
  </g>
  <!-- 会場 -->
  <rect x="760" y="120" width="560" height="260" fill="#d7d2c8" stroke="#8d8577" stroke-width="3"/>
  <rect x="880" y="170" width="320" height="160" fill="#c6bfb2" stroke="#8d8577" stroke-width="2"/>
  <!-- 広場 -->
  <rect x="760" y="560" width="300" height="220" fill="#f1e6cc" stroke="#c7b58a" stroke-width="2"/>
  <!-- 駐車場 -->
  <rect x="80" y="560" width="440" height="260" fill="#dfe1e4" stroke="#9aa0a6" stroke-width="2"/>
  <g stroke="#9aa0a6" stroke-width="2">
    <line x1="140" y1="560" x2="140" y2="640"/><line x1="200" y1="560" x2="200" y2="640"/>
    <line x1="260" y1="560" x2="260" y2="640"/><line x1="320" y1="560" x2="320" y2="640"/>
    <line x1="380" y1="560" x2="380" y2="640"/><line x1="440" y1="560" x2="440" y2="640"/>
    <line x1="140" y1="740" x2="140" y2="820"/><line x1="200" y1="740" x2="200" y2="820"/>
    <line x1="260" y1="740" x2="260" y2="820"/><line x1="320" y1="740" x2="320" y2="820"/>
    <line x1="380" y1="740" x2="380" y2="820"/><line x1="440" y1="740" x2="440" y2="820"/>
  </g>
  <!-- 別棟 -->
  <rect x="1380" y="120" width="160" height="220" fill="#d7d2c8" stroke="#8d8577" stroke-width="3"/>
  <rect x="120" y="980" width="200" height="90" fill="#d7d2c8" stroke="#8d8577" stroke-width="3"/>
  <!-- 門 -->
  <rect x="1000" y="380" width="80" height="16" fill="#8d8577"/>
  <!-- 文字 -->
  <g font-family="sans-serif" font-size="30" fill="#5d5548" text-anchor="middle">
    <text x="1040" y="260">会場棟（架空）</text>
    <text x="910" y="680">広場</text>
    <text x="300" y="700">駐車場</text>
    <text x="1460" y="240">別棟</text>
    <text x="250" y="220">緑地</text>
    <text x="1360" y="890">緑地</text>
    <text x="220" y="1030">待機所</text>
  </g>
  <g font-family="sans-serif" font-size="22" fill="#8d8577" text-anchor="middle">
    <text x="1040" y="412">正門</text>
    <text x="330" y="455">東西通り</text>
    <text x="700" y="80" transform="rotate(90 700 80)">中央通り</text>
  </g>
  <!-- 方位 -->
  <g transform="translate(1520 1030)">
    <circle r="34" fill="#fff" stroke="#8d8577" stroke-width="2"/>
    <path d="M0 -26 L9 6 L0 0 L-9 6 Z" fill="#5d5548"/>
    <text y="24" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#5d5548">N</text>
  </g>
</svg>
